name: Build and deploy

on:
  push:
    branches: [nexus]
  workflow_dispatch:

# Cancel an in-flight deploy if a newer push lands
concurrency:
  group: deploy-nexus
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Connect to Tailscale
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_CLIENT_SECRET }}
          tags: tag:ci

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          # Trust the server's host key over the (WireGuard-authenticated) tailnet
          ssh-keyscan -H "${{ secrets.REMOTE_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null
      - name: Deploy via rsync
        run: |
          rsync -avz --delete \
            -e "ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o UserKnownHostsFile=~/.ssh/known_hosts" \
            dist/ "${{ secrets.REMOTE_USER }}@${{ secrets.REMOTE_HOST }}:${{ secrets.REMOTE_TARGET }}/"

      - name: Deploy to origin servers (nexus + rift)
        run: |
          for target in secondary@100.117.206.72 tertiary@100.88.253.38; do
            ssh-keyscan -H "${target#*@}" >> ~/.ssh/known_hosts 2>/dev/null
            rsync -rlptvz --delete \
              -e "ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o UserKnownHostsFile=~/.ssh/known_hosts" \
              dist/ "$target:${{ secrets.REMOTE_TARGET }}/"
          done

      - name: Telegram notification
        if: success()
        run: |
          curl -sS -m 10 "https://api.telegram.org/bot${{ secrets.TG_BOT_TOKEN }}/sendMessage" \
            -d chat_id="${{ secrets.TG_CHAT_ID }}" \
            -d text="✅ deployed ${{ github.repository }} → nexus + rift (+ webhost fallback) @ ${{ github.sha }}" >/dev/null
